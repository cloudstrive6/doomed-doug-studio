# Doomed Doug: channel + pipeline configuration. Agents read this; code reads this.
channel:
  name: "Doomed Doug"
  handle: "@DoomedDoug"
  niche: "Disturbing science & nature (nature horror): deep sea, parasites, prehistoric oceans, deadly places, extreme environments"
  premise: "Every video, we send Doug (a stick man in a red cap) somewhere nature really doesn't want him."
  language: en-US
  category_id: "28"          # Science & Technology
  made_for_kids: false       # ALWAYS false; content is adult-coded dark humour
  default_tags: ["doomed doug", "stick figure", "science explained", "nature", "ocean", "animation"]

voice:                       # Google Cloud TTS, Chirp 3: HD
  name: "en-US-Chirp3-HD-Charon"   # chosen 2026-09-29: neutral, informative, deadpan (closest to the format)
  language: en-US
  speaking_rate: 1.145        # editor calibrates so timing.json wpm_speech lands at 190-205 (style bible)
  fallback_wpm: 197          # only used for dry runs without an API key

video:
  fps: 60                    # delivered as 1080p60 (YouTube serves the higher-bitrate 1080p60 stream)
  width: 1920
  height: 1080
  gap_between_shots: 0.12    # seconds of silence after each shot's line
  target_minutes: [15, 18]
  music: null                # low bed under narration, e.g. assets/music/bed.mp3 (YouTube Audio Library / CC0 only)
  music_volume: 0.06
  sting: null                # short swell at each item change, e.g. assets/music/sting.mp3
  sting_volume: 0.5

style:                       # MS Paint engine
  boil_variants: 3           # number of wobble drawings cycled per shot (GIF-like loop)
  boil_fps: 8
  boil_px: 1.6
  wobble_px: 1.2

schedule:
  timezone: "America/New_York"     # publish slots target US viewers (12:00 New York = 05:00 NZDT / 04:00 NZST)
  display_timezone: "Pacific/Auckland"   # every time shown to the owner (Telegram, status, logs) is in NZ time
  publish_time: "12:00"
  review_window_days: 1      # videos are uploaded >= this many days before going public (owner review window); 1 = daily launch pace
  launch:                    # binge-able back catalogue first: one video EVERY day for the first N uploads
    episodes: 28
    publish_days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
    queue_target: 4          # keep this many scheduled-but-unpublished videos in the queue during launch
  publish_days: ["Fri"]      # after the launch: one long video a week
  episodes_ahead: 1          # after the launch: scheduled videos to keep in the queue

shorts:                      # vertical Shorts cut from each episode, pointing viewers to the long video
  per_episode: 3
  publish_times: ["09:00", "19:00"]   # launch phase, New York time = 2:00 AM and 12:00 PM NZDT
  weekly_publish_times: ["19:00"]     # after the launch: 1 Short a day (12:00 PM NZDT); launch backlog keeps it daily
  playlist: "Doomed Doug Shorts"

social:                      # Facebook + Instagram cross-posting (after the YouTube publish time)
  facebook_long: true        # full episode as a native Facebook Page video
  facebook_reels: true       # each Short as a Facebook Reel
  instagram_reels: true      # each Short as an Instagram Reel
  hashtags: "#DoomedDoug #deepsea #ocean #science #animals #creepyfacts"
  tiktok: true               # each Short to TikTok via Post for Me (project "Doomed Doug")
  tiktok_handle: "doomeddoug"   # safety: only ever post to this account (external id or username)
  tiktok_hashtags: "#DoomedDoug #science #deepsea #animals #fyp"

github:
  actions_warn_at: 1500      # minutes/month: warning alert
  actions_public_at: 1900    # minutes/month: automatically switch this repo to Public (free unlimited minutes)

youtube:
  privacy_until_publish: private
  playlists:
    ocean: "Doug vs. the Ocean"
    parasites: "Doug vs. Parasites"
    prehistoric: "Doug vs. Prehistoric Earth"
    places: "Doug vs. Deadly Places"
    compilations: "Full Series & Marathons"

competitors:                 # watched by the growth analyst (channel handles, verified 2026-09-29)
  - "@ThePaintExplainer"
  - "@mr.scienceYT"
  - "@Paintify7"
  - "@Spinosnack"
  - "@OfficialBeyondTheBlue"
  - "@BluntlyExplained"
  - "@ExtinctZoo"
  - "@SimplePaintOfficial"
  - "@quackdoc"
  - "@Bacterium-EN"
  - "@octolabyt"             # OctoLab (ocean predators), added 2026-10-01, handle verified via API
  - "@fossilvideos"          # Fossil (prehistoric "every era"), added 2026-10-01, handle verified via API
