name: Produce episode

on:
  schedule:
    - cron: "0 5 * * *"          # twice daily; the queue check decides whether a new episode is needed
    - cron: "0 17 * * *"         # (launch: 1 video/day for the first 28 uploads, then 1/week on Fridays)
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Produce + render but don't upload"
        type: boolean
        default: false
      force:
        description: "Produce even if the queue is full"
        type: boolean
        default: false

concurrency:
  group: produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      need: ${{ steps.q.outputs.need }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state when the job STARTS (a queued run would otherwise check out its stale trigger commit)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q PyYAML tzdata
      - id: q
        name: Is another episode needed?
        run: python -m studio queue --github-output

  produce:
    needs: check
    if: ${{ needs.check.outputs.need == 'true' || inputs.force }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY_BACKUP: ${{ secrets.ANTHROPIC_API_KEY }}  # only used after the subscription limit is hit
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # latest state when the job STARTS (a queued run would otherwise check out its stale trigger commit)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          git config user.name "doomed-doug-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - name: Restore narration cache (saves Chirp 3 HD characters on retries)
        uses: actions/cache/restore@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-

      - name: "Stage A: agents write, draw and package the episode"
        run: |
          rm -f .current_episode
          bash pipeline/claude_run.sh claude_stage_a.jsonl 600 "$(cat pipeline/prompts/produce_episode.md)"
          test -s .current_episode || { echo "Stage A did not produce a packaged episode"; exit 1; }
          echo "EP=$(cat .current_episode)" >> "$GITHUB_ENV"

      - name: Save progress
        if: always()
        run: git add -A episodes data channel assets && (git commit -m "stage A progress" || true) && git pull --rebase -X theirs && git push

      - name: "Stage B: final render + technical QC"
        run: |
          python -m studio render "$EP" --final
          python -m studio thumbnail "$EP"
          python -m studio shorts render "$EP" || echo "Shorts render failed (long video continues)"
          python -m studio qc "$EP" && echo "QC_OK=1" >> "$GITHUB_ENV" || echo "QC_OK=0" >> "$GITHUB_ENV"

      - name: "Stage C: final screening + approval"
        run: |
          rm -f .rerender
          bash pipeline/claude_run.sh claude_stage_c.jsonl 300 "QC exit status: ${QC_OK}. $(cat pipeline/prompts/review_final.md)"

      - name: "Stage C round 2: re-render the fixes, re-run QC, re-screen"
        run: |
          if [ ! -f .rerender ]; then echo "no re-render requested"; exit 0; fi
          cat .rerender
          if grep -q final .rerender || [ "${QC_OK}" != "1" ]; then python -m studio render "$EP" --final; python -m studio thumbnail "$EP"; fi
          python -m studio shorts render "$EP" || echo "Shorts render failed (long video continues)"
          python -m studio qc "$EP" && QC2=1 || QC2=0
          echo "QC_OK=$QC2" >> "$GITHUB_ENV"
          rm -f .rerender
          bash pipeline/claude_run.sh claude_stage_c2.jsonl 300 "ROUND 2 (re-rendered after your fixes). QC exit status: ${QC2}. $(cat pipeline/prompts/review_final.md)"

      - name: Approval gate (mechanical check of QC + screener + creative director)
        run: python -m studio gate "$EP"

      - name: Upload to YouTube (scheduled, private until publish time)
        if: ${{ !inputs.skip_upload }}
        run: |
          python -m studio upload "$EP"
          python -m studio social release "$EP" || python -m studio notify "Could not attach $EP media to a GitHub release (needed for Facebook/Instagram). Log: $RUN_URL"
          python -m studio shorts upload "$EP" || python -m studio notify "Shorts upload failed for $EP (long video is fine). Log: $RUN_URL"

      - name: Prune and save narration cache
        if: always()
        run: find .cache/tts -type f -mtime +21 -delete 2>/dev/null || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save state
        if: always()
        run: |
          rm -rf episodes/*/build/tts_cache
          git add -A episodes data channel assets && (git commit -m "${EP:-episode}: produced" || true) && git pull --rebase -X theirs && git push

      - name: "Keep the video for 14 days (private repo only; public artifacts are downloadable by anyone)"
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ env.EP }}
          path: |
            episodes/${{ env.EP }}/build/final.mp4
            episodes/${{ env.EP }}/build/thumbnail.png
            episodes/${{ env.EP }}/build/captions.srt
            claude_stage_*.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Why did the agents stop? (on failure)
        if: failure()
        run: |
          python - <<'EOF'
          import json, glob
          for f in sorted(glob.glob("claude_stage_*.jsonl")):
              last = None
              for line in open(f, encoding="utf-8", errors="replace"):
                  try:
                      j = json.loads(line)
                  except Exception:
                      continue
                  if j.get("type") == "result":
                      last = j
              if last:
                  print(f, "| subtype:", last.get("subtype"), "| is_error:", last.get("is_error"),
                        "| turns:", last.get("num_turns"), "| minutes:", round((last.get("duration_ms") or 0) / 60000, 1))
                  print(str(last.get("result", ""))[:2500])
              else:
                  print(f, "has no result line; last 1500 chars:")
                  print(open(f, encoding="utf-8", errors="replace").read()[-1500:])
          EOF

      - name: Alert on failure
        if: failure()
        run: |
          python -m studio notify "❌ Doomed Doug production failed (${EP:-no episode}). Log: $RUN_URL"
