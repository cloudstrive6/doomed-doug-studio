name: Competitor snapshot (daily)

# Daily views of the watched competitors' last 50 uploads -> current views/hour (vph_recent) per video,
# which tells the growth analyst whether a topic is still pulling viewers right now. ~30 API units/day.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m studio competitors
      - name: Save
        run: |
          git config user.name "doomed-doug-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A data/competitors && (git commit -m "competitor snapshot" || true) && git pull --rebase -X theirs && git push
