name: What If setup
description: Python, ffmpeg, Claude Code, git identity and the narration cache for a What If job
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install tools
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        pip install -q -r requirements.txt
        npm install -g @anthropic-ai/claude-code
        git config user.name "doomed-doug-bot"
        git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
    - name: Restore narration cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/tts
        key: tts-whatif-${{ github.run_id }}-${{ github.job }}
        restore-keys: |
          tts-whatif-
          tts-
